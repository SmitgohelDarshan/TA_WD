<!DOCTYPE html>
<html>
<head>
    <title>HTML Tags Demo</title>
</head>
<body>

    <h2>Preformatted Text</h2>
    <pre>
Name    Age    City
MR x    25     London
MR y    22     Paris
    </pre>

    <h2>Underline Tag</h2>
    <u>This text is underlined.</u>

    <h2>Bold Tag</h2>
    <b>This text is bold.</b>

    <h2>Italic Tag</h2>
    <i>This text is italic.</i>

    <h2>Inserted and Deleted Tags</h2>
    <p>
        Original Price: <del>₹1000</del><br>
        New Price: <ins>₹800</ins>
    </p>

</body>
</html>
