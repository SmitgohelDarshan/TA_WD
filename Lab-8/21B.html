<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tag demo</title>
</head>
<body>
    
    <center>
        <h1>
            LAB 8 Q21
        </h1>
    </center>

    <hr>

    <center>
        <table border="1" width="500px" >
            
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>

            <tr>
                <td rowspan="2">4</td>
                <td>5</td>
                <td>6</td>
            </tr>

              <tr>
                <td rowspan="2">7</td>
                <td>8</td>
            </tr>

              <tr>
                <td>9</td>
                <td >10</td>
            </tr>

        </table>
     </center>

</body>
</html>
